[package]
name = "raft-rust"
version = "0.1.0"
description = "Standalone Raft consensus library extracted from toydb (erikgrinaker/toydb)"
authors = ["Erik Grinaker <erik@grinaker.org>"]
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
name = "raft_rust"
path = "src/lib.rs"

[[example]]
name = "kv_cluster"
path = "examples/kv_cluster.rs"

[dependencies]
bincode = { version = "2.0", features = ["serde"] }
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
itertools = "0.14"
log = "0.4"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
env_logger = "0.11"
serde_json = "1.0"
