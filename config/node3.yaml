# 节点 3
node:
  id: 3
  listen: "127.0.0.1:7003"
  data_dir: "data/node3"

peers:
  - { id: 1, addr: "127.0.0.1:7001" }
  - { id: 2, addr: "127.0.0.1:7002" }

options:
  heartbeat_interval: 2
  election_timeout_min: 5
  election_timeout_max: 10
  max_append_entries: 100
  pre_vote: true
  check_quorum: true
  snapshot_threshold: 1000
